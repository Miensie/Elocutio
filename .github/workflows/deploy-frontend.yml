name: Déployer le frontend sur GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Build (variables injectées depuis les secrets du repo)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          # Doit correspondre à /nom-du-repo/ — voir la variable de repo
          # GH_PAGES_BASE, ou à défaut le nom du repo courant.
          VITE_BASE_PATH: /${{ vars.GH_PAGES_BASE || github.event.repository.name }}/
        run: npm run build

      - name: Préparer le fallback SPA (404 -> index)
        # Filet de sécurité en plus du HashRouter : si quelqu'un accède
        # directement à une URL qui n'existe pas comme fichier statique,
        # GitHub Pages sert 404.html. On y met une copie d'index.html.
        run: cp dist/index.html dist/404.html

      - name: Uploader l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
